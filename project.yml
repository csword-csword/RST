name: RST
options:
  bundleIdPrefix: fitness.pinpoint
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
# Added to the project navigator (no target membership) so it can be selected as
# the scheme's StoreKit configuration for local IAP testing. See SUBSCRIPTION.md.
fileGroups:
  - Pinpoint.storekit
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  RST:
    type: application
    platform: iOS
    sources:
      - RST
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fitness.pinpoint.app
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Pinpoint
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: "Pinpoint uses the camera to identify gym machines and read the weight stack."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Pinpoint records where your workouts take place."
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Pinpoint connects to the smart pin device on weight machines to track your sets and reps."
  RSTTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - RSTTests
    dependencies:
      - target: RST
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/RST.app/RST"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  RST:
    build:
      targets:
        RST: all
    run:
      config: Debug
    test:
      targets:
        - RSTTests
